name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:all


  test-prettier-versions:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.9.0, 3.9.1 and 3.9.2 are intentionally excluded. They mis-parse
        # decorators on `declare` class fields and crash on tests/cases (see
        # issue #454). Fixed upstream in 3.9.3 (prettier/prettier#19492).
        prettier-version: ['3.5.3', '3.6.0', '3.6.1', '3.6.2', '3.7.0', '3.7.1', '3.7.2', '3.7.3', '3.8.0', '3.8.1', '3.8.2', '3.8.3', '3.8.4', '3.8.5', '3.9.3', '3.9.4', '3.9.5', '3.9.6', 'latest']

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm add -D prettier@${{ matrix.prettier-version }} -w

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
